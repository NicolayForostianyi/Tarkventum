<!DOCTYPE html>
<html lang="ru" data-theme="black">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tarkventum — доска и Канбан</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <!-- Lobby -->
  <div id="lobby" class="lobby">
    <div class="lobby-card">
      <div class="logo">
        <span class="logo-mark">T</span>
        <h1>Tarkventum</h1>
      </div>
      <p class="tagline">Совместная доска, диаграммы и Канбан в реальном времени</p>
      <label class="field">
        <span>Ваше имя</span>
        <input id="name-input" type="text" maxlength="32" placeholder="Как вас зовут?" autocomplete="nickname" />
      </label>
      <label class="field">
        <span>Код комнаты</span>
        <input id="room-input" type="text" maxlength="32" placeholder="например: demo" autocomplete="off" />
      </label>
      <label class="field">
        <span>Тема оформления</span>
        <select id="theme-select-lobby" class="theme-select">
          <option value="black">Чёрная</option>
          <option value="white">Белая</option>
          <option value="green">Зелёная</option>
          <option value="blue">Синяя</option>
        </select>
      </label>
      <div class="lobby-actions">
        <button id="btn-create" class="btn primary" type="button">Создать комнату</button>
        <button id="btn-join" class="btn" type="button">Войти</button>
      </div>
      <p id="lobby-error" class="error hidden"></p>
      <p class="hint">Ссылка вида <code>/r/код</code> тоже открывает комнату</p>
    </div>
  </div>

  <!-- App -->
  <div id="app" class="app hidden">
    <!-- Browser-like room tabs -->
    <div class="room-tabs-bar" id="room-tabs-bar">
      <div class="room-tabs" id="room-tabs"></div>
      <button id="btn-new-tab" class="room-tab-new" type="button" title="Новая вкладка / открыть комнату">+</button>
    </div>

    <header class="topbar">
      <div class="topbar-left">
        <span class="brand">Tarkventum</span>
        <span class="room-badge" id="room-badge"></span>
        <button id="btn-copy-link" class="btn ghost small" type="button" title="Скопировать ссылку">Ссылка</button>
      </div>
      <div class="view-tabs">
        <button id="tab-canvas" class="tab active" type="button" data-view="canvas">Холст</button>
        <button id="tab-kanban" class="tab" type="button" data-view="kanban">Канбан</button>
      </div>
      <div class="topbar-right">
        <select id="theme-select" class="theme-select compact" title="Тема">
          <option value="black">Чёрная</option>
          <option value="white">Белая</option>
          <option value="green">Зелёная</option>
          <option value="blue">Синяя</option>
        </select>
        <div id="presence" class="presence"></div>
        <button id="btn-leave" class="btn ghost small" type="button">Выйти</button>
      </div>
    </header>

    <div class="main-row">
      <div class="workspace">
        <!-- Canvas view -->
        <section id="view-canvas" class="view view-canvas">
          <aside class="toolbar" id="toolbar">
            <button class="tool active" data-tool="select" title="Выделение (V)" type="button">↖</button>
            <button class="tool" data-tool="pan" title="Рука / панорама (H)" type="button">✋</button>
            <button class="tool" data-tool="pen" title="Перо (P)" type="button">✎</button>
            <div class="tool-sep"></div>
            <button class="tool" data-tool="rect" title="Прямоугольник (R)" type="button">▭</button>
            <button class="tool" data-tool="square" title="Квадрат" type="button">□</button>
            <button class="tool" data-tool="circle" title="Круг" type="button">○</button>
            <button class="tool" data-tool="ellipse" title="Эллипс / овал (O)" type="button">◯</button>
            <button class="tool" data-tool="task" title="BPMN: задача" type="button">▢</button>
            <button class="tool" data-tool="gateway" title="BPMN: шлюз" type="button">◇</button>
            <button class="tool" data-tool="event" title="BPMN: событие" type="button">⬭</button>
            <div class="tool-sep"></div>
            <button class="tool" data-tool="connector" title="Соединитель (C)" type="button">⟷</button>
            <button class="tool" data-tool="line" title="Линия (L)" type="button">╱</button>
            <button class="tool" data-tool="arrow" title="Стрелка (A)" type="button">→</button>
            <button class="tool" data-tool="sticky" title="Стикер (S)" type="button">🗒</button>
            <button class="tool" data-tool="text" title="Текст (T)" type="button">T</button>
            <button class="tool" data-tool="roomLink" title="Ссылка на комнату" type="button">↗</button>
            <div class="tool-sep"></div>
            <label class="color-pick" title="Цвет">
              <input id="stroke-color" type="color" value="#1f2937" />
            </label>
            <button id="btn-delete" class="tool danger" title="Удалить (Del)" type="button">⌫</button>
          </aside>
          <div class="canvas-wrap" id="canvas-wrap">
            <canvas id="board"></canvas>
            <div id="cursors" class="cursors"></div>
            <div id="inline-edit" class="inline-edit hidden" contenteditable="true" spellcheck="false"></div>
            <div id="room-link-panel" class="room-link-panel hidden">
              <div class="room-link-panel-head">
                <strong>Ссылка на комнату</strong>
                <button id="room-link-panel-close" class="btn ghost small" type="button" title="Закрыть">✕</button>
              </div>
              <label class="field">
                <span>Код комнаты</span>
                <input id="room-link-id" type="text" maxlength="32" placeholder="например: demo" autocomplete="off" />
              </label>
              <label class="field">
                <span>Заголовок (необязательно)</span>
                <input id="room-link-label" type="text" maxlength="80" placeholder="Название ссылки" autocomplete="off" />
              </label>
              <div class="modal-actions">
                <button id="room-link-open" class="btn" type="button">Открыть</button>
                <div class="spacer"></div>
                <button id="room-link-save" class="btn primary" type="button">Сохранить</button>
              </div>
              <p class="room-link-hint">Двойной клик по фигуре — открыть комнату. Alt+двойной клик — изменить.</p>
            </div>
            <div id="zoom-label" class="zoom-label">100%</div>
            <div id="connector-hint" class="connector-hint hidden">Выберите фигуру-источник, затем фигуру-цель</div>
          </div>
        </section>

        <!-- Kanban view -->
        <section id="view-kanban" class="view view-kanban hidden">
          <div class="kanban-toolbar">
            <button id="btn-add-column" class="btn primary small" type="button">+ Колонка</button>
          </div>
          <div id="kanban-board" class="kanban-board"></div>
        </section>
      </div>

      <!-- Card side panel -->
      <aside id="card-panel" class="card-panel hidden">
        <div class="card-panel-header">
          <h2>Карточка</h2>
          <button id="card-panel-close" class="btn ghost small" type="button" title="Закрыть">✕</button>
        </div>
        <div class="card-panel-body">
          <label class="field">
            <span>Заголовок</span>
            <input id="card-title" type="text" maxlength="200" />
          </label>
          <label class="field">
            <span>Описание</span>
            <textarea id="card-desc" rows="6" maxlength="2000" placeholder="Текст описания…"></textarea>
          </label>
          <label class="field">
            <span>Срок</span>
            <input id="card-due" type="date" />
          </label>
          <div class="modal-actions">
            <button id="card-delete-btn" class="btn danger" type="button">Удалить</button>
            <div class="spacer"></div>
            <button id="card-save-btn" class="btn primary" type="button">Сохранить</button>
          </div>
        </div>
      </aside>

      <!-- Chat sidebar -->
      <aside class="chat-panel" id="chat-panel">
        <div class="chat-header">
          <h2>Чат</h2>
          <button id="btn-toggle-chat" class="btn ghost small" type="button" title="Свернуть">◀</button>
        </div>
        <div id="chat-messages" class="chat-messages"></div>
        <form id="chat-form" class="chat-form">
          <input id="chat-input" type="text" maxlength="1000" placeholder="Написать сообщение…" autocomplete="off" />
          <button type="submit" class="btn primary small">Отправить</button>
        </form>
      </aside>
    </div>
  </div>

  <!-- Open room dialog -->
  <div id="modal-open-room" class="modal hidden">
    <div class="modal-card">
      <h3>Открыть комнату</h3>
      <label class="field">
        <span>Код комнаты</span>
        <input id="open-room-input" type="text" maxlength="32" placeholder="код или пусто — создать новую" />
      </label>
      <div class="modal-actions">
        <div class="spacer"></div>
        <button id="open-room-cancel" class="btn" type="button">Отмена</button>
        <button id="open-room-ok" class="btn primary" type="button">Открыть</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
